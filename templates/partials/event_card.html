<article class="event-card{% if event.cancelled %} is-cancelled{% endif %}">
  <a class="event-card-media" href="{{ url_for('event_detail', event_id=event.id) }}">
    <img src="{{ event.image_url }}" alt="{{ event.title }}" loading="lazy">
    {% if event.cancelled %}
      <span class="badge badge-danger event-card-status">Отменено</span>
    {% endif %}
  </a>
  <div class="event-card-body">
    <div class="event-card-meta">
      <span class="badge">{{ event.category }}</span>
      <time datetime="{{ event.datetime }}">{{ event.datetime_display }}</time>
    </div>
    <h3 class="event-card-title">
      <a href="{{ url_for('event_detail', event_id=event.id) }}">{{ event.title }}</a>
    </h3>
    <p class="event-card-place">{{ event.place }}</p>
    <p class="event-card-desc">{{ event.short_description }}</p>
    <div class="event-card-footer">
      <span class="seats">Мест: {{ event.seats_left }}</span>
      <a class="text-link" href="{{ url_for('event_detail', event_id=event.id) }}">Подробнее</a>
    </div>
  </div>
</article>
